<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta

      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#312e81" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Showroom" />
    <meta

    <link rel="icon" type="image/png" href="./icon-192.png" />

    <title>Showroom Manager — GST Billing</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        font-family: system-ui, sans-serif;
        color: #312e81;
        z-index: 9999;
      }
      #boot .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #4338ca, #312e81);

        align-items: center;
        justify-content: center;
        font-size: 30px;
        box-shadow: 0 10px 30px rgba(49, 46, 129, 0.35);
      }
    </style>

  <body>
    <div id="boot">
      <div class="logo">🏪</div>
      <div style="font-weight: 700">Showroom Manager</div>
      <div style="font-size: 12px; opacity: 0.7">लोड हो रहा है…</div>
    </div>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
